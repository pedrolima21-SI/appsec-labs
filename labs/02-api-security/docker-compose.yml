from __future__ import annotations

from fastapi.testclient import TestClient

from tests.conftest import auth, login


def test_vulnerable_mode_allows_cross_owner_read(vulnerable_client: TestClient):
    headers = auth(login(vulnerable_client, "alice", "alice12345"))
    response = vulnerable_client.get("/api/reports/2", headers=headers)
    assert response.status_code == 200
    assert response.json()["owner_id"] == 2


def test_vulnerable_mode_allows_cross_owner_edit(vulnerable_client: TestClient):
    headers = auth(login(vulnerable_client, "alice", "alice12345"))
    response = vulnerable_client.patch("/api/reports/2", headers=headers, json={"content": "tampered-by-alice"})
    assert response.status_code == 200
    assert response.json()["content"] == "tampered-by-alice"


def test_secure_mode_blocks_same_cross_owner_access(secure_client: TestClient):
    headers = auth(login(secure_client, "alice", "alice12345"))
    response = secure_client.get("/api/reports/2", headers=headers)
    assert response.status_code == 404
